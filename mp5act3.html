<!DOCTYPE html>
<html>
<head>
    <title>Sorting Activity</title>
</head>

<body>

    <h1>Sorting Program</h1>

    <input type="number" id="numberInput">

    <button onclick="addNumber()">Add</button>
    <button onclick="sortNumbers()">Sort</button>
    <button onclick="displayNumbers()">Display</button>

    <p id="output"></p>

    <script>

        // Create an empty array
        let numbers = [];

        // Store the original array
        let originalNumbers = [];

        // Store the sorted array
        let sortedNumbers = [];


        // Add a number to the array
        function addNumber() {

            let input = document.getElementById("numberInput");

            if (input.value === "") {

                document.getElementById("output").innerHTML =
                    "Please enter a number.";

                return;
            }

            let number = Number(input.value);

            // Add number to the array
            numbers.push(number);

            // Update original array
            originalNumbers = [...numbers];

            document.getElementById("output").innerHTML =
                "Number added: " + number;

            input.value = "";
        }


        // Display the arrays
        function displayNumbers() {

            if (numbers.length === 0) {

                document.getElementById("output").innerHTML =
                    "Array is empty.";

                return;
            }

            document.getElementById("output").innerHTML =
                "Original Array: " + originalNumbers.join(" ") + "<br>" +
                "Sorted Array: " + sortedNumbers.join(" ");
        }


        // BUBBLE SORT
        function sortNumbers() {

            if (numbers.length === 0) {

                document.getElementById("output").innerHTML =
                    "Array is empty.";

                return;
            }

            // Copy original array before sorting
            sortedNumbers = [...numbers];

            // Bubble Sort
            for (let i = 0; i < sortedNumbers.length - 1; i++) {

                for (let j = 0; j < sortedNumbers.length - 1 - i; j++) {

                    if (sortedNumbers[j] > sortedNumbers[j + 1]) {

                        let temp = sortedNumbers[j];

                        sortedNumbers[j] = sortedNumbers[j + 1];

                        sortedNumbers[j + 1] = temp;
                    }
                }
            }

            document.getElementById("output").innerHTML =
                "Array sorted successfully.<br>" +
                "Original Array: " + originalNumbers.join(" ") + "<br>" +
                "Sorted Array: " + sortedNumbers.join(" ");
        }

    </script>

</body>
</html>
