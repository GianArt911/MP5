<!DOCTYPE html>
<html>
<head>
    <title>Array Activity</title>
</head>

<body>

    <h1>Array Activity</h1>

    <input type="text" id="input" placeholder="Enter an item">
    <button onclick="addItem()">Add</button>
    <button onclick="displayItems()">Display</button>

    <br><br>

    <input type="text" id="searchInput" placeholder="Value to search">
    <button onclick="searchItem()">Search</button>

    <p id="output"></p>

    <script>
        // Create an empty array
        let items = [];

        // Add an item
        function addItem() {
            const input = document.getElementById("input");
            const item = input.value.trim();

            if (item === "") {
                document.getElementById("output").innerHTML =
                    "Please enter something.";
                return;
            }

            items.push(item);
            console.log("Added:", item);
            console.log("Array:", items);

            input.value = "";
            document.getElementById("output").innerHTML =
                `Added '${item}' to the array.`;
        }

        // Display all items
        function displayItems() {
            let result = "";

            for (let i = 0; i < items.length; i++) {
                result += items[i] + "<br>";
            }

            if (result === "") {
                result = "The array is empty.";
            }

            document.getElementById("output").innerHTML = result;
            console.log("Array:", items);
        }

        // Search an item manually through the array
        function searchItem() {
            const target = document.getElementById("searchInput").value.trim();

            if (target === "") {
                document.getElementById("output").innerHTML =
                    "Please enter a value to search.";
                return;
            }

            let found = false;
            for (let i = 0; i < items.length; i++) {
                if (items[i] === target) {
                    document.getElementById("output").innerHTML =
                        `Value '${target}' found at index ${i}.`;
                    found = true;
                    break;
                }
            }

            if (!found) {
                document.getElementById("output").innerHTML =
                    `Value '${target}' does not exist in the array.`;
            }

            console.log("Search target:", target, "Found:", found);
        }
    </script>

</body>
</html>
